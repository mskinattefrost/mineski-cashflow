function fmt(n, compact) {
  if (n===null||n===undefined||isNaN(n)) return "—";
  var abs = Math.abs(n);
  if (compact) {
    if (abs>=1e6) return (n<0?"(":"")+"₱"+(abs/1e6).toFixed(2)+"M"+(n<0?")":"");
    if (abs>=1e3) return (n<0?"(":"")+"₱"+(abs/1e3).toFixed(0)+"K"+(n<0?")":"");
    return (n<0?"(":"")+"₱"+abs.toFixed(0)+(n<0?")":"");
  }
  return (n<0?"(₱":"₱")+abs.toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2})+(n<0?")":"");
}

    byAccountMap[r.account].count++;
    byAccountMap[r.account].total+=r.amount;

function ArrearsTab() {
  var fmt = function(n){ return "₱"+Math.round(n).toLocaleString(); };
  var pct = function(a,b){ return b>0?Math.round(a/b*100)+"%":"0%"; };

  // Payment simulation state: inflow input per month
  var _inflow = useState({Jul:0,Aug:0,Sep:0,Oct:0,Nov:0,Dec:0});
  var inflow=_inflow[0], setInflow=_inflow[1];

  var H2_COS = {Jul:4853320,Aug:9940492,Sep:5708906,Oct:7028619,Nov:9940492,Dec:10896906};
  var H2_GAE = {Jul:3000700,Aug:6376700,Sep:3000700,Oct:4688700,Nov:6376700,Dec:8188700};
  var months = ["Jul","Aug","Sep","Oct","Nov","Dec"];

  // Compute surplus and 15% allocation per month
  var schedule = months.map(function(m){
    var inf = Number(inflow[m])||0;
    var surplus = inf - H2_COS[m] - H2_GAE[m];
    var alloc = surplus > 0 ? Math.round(surplus * 0.15) : 0;
    return {m:m, inflow:inf, cos:H2_COS[m], gae:H2_GAE[m], surplus:surplus, alloc:alloc};
  });
  var totalAlloc = schedule.reduce(function(s,r){return s+r.alloc;},0);

  // Waterfall: distribute totalAlloc through vendor queue
  var remaining = totalAlloc;
  var vendorPayments = ARREARS_VENDORS.map(function(v){
    var pay = Math.min(v.a, remaining);
    remaining = Math.max(0, remaining - pay);
    return {n:v.n, owed:v.a, pay:pay, t:v.t, c:v.c, i:v.i};
  });
  var unpaidAfter = ARREARS_TOTAL - totalAlloc;

  // Styles
  var card = {background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:12,padding:"1rem 1.25rem",marginBottom:12};

  var metricWrap = {display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:10,marginBottom:"1.5rem"};
  var metric = function(label,val,red){
    return h('div',{style:{background:"var(--color-background-secondary)",borderRadius:8,padding:"0.875rem 1rem"}},
      h('p',{style:{fontSize:11,color:"var(--color-text-secondary)",margin:"0 0 3px"}},[label]),
      h('p',{style:{fontSize:17,fontWeight:500,margin:0,color:red?"#A32D2D":"var(--color-text-primary)"}},[val])
    );

  // Recommendation banner

  var bannerStyle = {
    borderRadius:10, padding:"0.875rem 1.125rem", marginBottom:"1.25rem",
    background: hasInflow ? "#EAF3DE" : "#FAEEDA",

              ]),
              h('td',{style:{padding:"6px 8px",borderBottom:"0.5px solid var(--color-border-tertiary)",fontWeight:isPriority?500:400,color:"var(--color-text-primary)"}},[
                v.n, isCleared ? h('span',{style:{marginLeft:6,background:"#EAF3DE",color:"#27500A",borderRadius:4,padding:"1px 5px",fontSize:10,fontWeight:500}},"CLEARED") : null
              ]),
              h('td',{style:{padding:"6px 8px",borderBottom:"0.5px solid var(--color-border-tertiary)",textAlign:"right",color:"var(--color-text-secondary)"}},[v.c]),
              h('td',{style:{padding:"6px 8px",borderBottom:"0.5px solid var(--color-border-tertiary)",textAlign:"right",color:"var(--color-text-secondary)"}},[v.i]),
              h('td',{style:{padding:"6px 8px",borderBottom:"0.5px solid var(--color-border-tertiary)",textAlign:"right"}},[fmt(v.owed)]),
              h('td',{style:{padding:"6px 8px",borderBottom:"0.5px solid var(--color-border-tertiary)",textAlign:"right",fontWeight:500,color:v.pay>0?"#27500A":"var(--color-text-secondary)"}},[v.pay>0?fmt(v.pay):"—"]),
              h('td',{style:{padding:"6px 8px",borderBottom:"0.5px solid var(--color-border-tertiary)",textAlign:"right",color:isCleared?"#27500A":"var(--color-text-primary)"}},[isCleared?"—":fmt(v.owed-v.pay)])
            );
          }).concat([
            h('tr',{key:"total",style:{background:"var(--color-background-secondary)"}},
              h('td',{colSpan:4,style:{padding:"6px 8px",fontWeight:500}},"Total"),
              h('td',{style:{padding:"6px 8px",textAlign:"right",fontWeight:500,color:"#A32D2D"}},[fmt(ARREARS_TOTAL)]),
              h('td',{style:{padding:"6px 8px",textAlign:"right",fontWeight:500,color:totalAlloc>0?"#27500A":"var(--color-text-secondary)"}},[fmt(totalAlloc)]),
              h('td',{style:{padding:"6px 8px",textAlign:"right",fontWeight:500,color:"#A32D2D"}},[fmt(Math.max(0,unpaidAfter))])
            )
          ])
        )
      )
    ),

    // Footer note
    h('div',{style:{fontSize:12,color:"var(--color-text-secondary)",marginTop:"1.5rem",padding:"0.75rem 1rem",background:"var(--color-background-secondary)",borderRadius:8,lineHeight:1.6}},
      "Rule: 15% of monthly surplus (inflow − COS − GAE) is allocated to arrears. Vendors paid in priority order: XSTATIC → Ryan Matias → Maxi One, then all remaining 2024/2025 arrears largest-to-smallest. This tab updates automatically each week when new inflow data is entered."
    )
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────

var SLIDES = ["Cover","Overview","Cash Position","Weekly Table","Weekly Table (Liquidity)","AR Standard","AR Summary","Full Year","AP Arrears"];
var COMPS = [Cover,Overview,CashPosition,WeeklyTable,WeeklyTableLiquidity,ARStandard,ARSummary,FullYear,ArrearsTab];

function App() {
  var _s = useState(0); var slide=_s[0],setSlide=_s[1];
  function nav(d){ setSlide(function(s){return Math.max(0,Math.min(SLIDES.length-1,s+d));}); }
  var SlideComp = COMPS[slide];
  return h('div',{className:"app-wrap"},
    h('div',{style:{display:"flex",gap:4,marginBottom:16,flexWrap:"wrap",alignItems:"center",borderBottom:"0.5px solid var(--color-border-tertiary)",paddingBottom:10}},
      SLIDES.map(function(s,i){
        return h('button',{key:i,onClick:function(){setSlide(i);},style:{background:slide===i?"#1a1a1a":"none",color:slide===i?"#fff":"var(--color-text-secondary)",border:"0.5px solid",borderColor:slide===i?"#1a1a1a":"var(--color-border-tertiary)",borderRadius:6,padding:"4px 11px",fontSize:12,fontWeight:slide===i?500:400,cursor:"pointer"}},s);
      }),
      h('div',{style:{marginLeft:"auto",display:"flex",gap:8,alignItems:"center"}},
        h('button',{onClick:function(){nav(-1);},disabled:slide===0,style:{background:"none",border:"0.5px solid var(--color-border-tertiary)",borderRadius:6,padding:"4px 10px",fontSize:12,cursor:"pointer",color:"var(--color-text-secondary)"}},"←"),
        h('span',{style:{fontSize:11,color:"var(--color-text-tertiary)"}},(slide+1)+" / "+SLIDES.length),
        h('button',{onClick:function(){nav(1);},disabled:slide===SLIDES.length-1,style:{background:"none",border:"0.5px solid var(--color-border-tertiary)",borderRadius:6,padding:"4px 10px",fontSize:12,cursor:"pointer",color:"var(--color-text-secondary)"}},"→")
      )
    ),
    h(SlideComp,null),
    h('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:20,paddingTop:12,borderTop:"0.5px solid var(--color-border-tertiary)"}},
      h('div',{style:{fontSize:11,color:"var(--color-text-tertiary)"}},"Mineski PH · "+WEEK+" · "+DATE),
      h('div',{style:{display:"flex",gap:8}},
        h('button',{onClick:function(){nav(-1);},disabled:slide===0,style:{background:"none",border:"0.5px solid var(--color-border-tertiary)",borderRadius:6,padding:"5px 14px",fontSize:12,cursor:"pointer",color:"var(--color-text-secondary)"}},"← Prev"),
        h('button',{onClick:function(){nav(1);},disabled:slide===SLIDES.length-1,style:{background:"#0f0f0f",border:"none",borderRadius:6,padding:"5px 14px",fontSize:12,cursor:"pointer",color:"#fff"}},"Next →")
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App,null));
</script>
